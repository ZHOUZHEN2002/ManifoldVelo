[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manifoldvelo"
version = "1.0.0"
description = "Joint pseudotime and RNA velocity inference on continuous expression manifolds"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-ManifoldVelo-Academic-Only"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
authors = [{name = "Zhen Zhou"}, {name = "ManifoldVelo contributors"}]
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "torch>=2.4,<3",
    "networkx>=3,<4",
    "threadpoolctl>=3",
]

[project.optional-dependencies]
graph = ["scanpy>=1.9.8,<2", "anndata>=0.9.2,<0.13", "pandas>=2,<3", "igraph>=0.11,<2", "leidenalg>=0.10,<0.12"]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
manifoldvelo = "manifoldvelo.cli:main"

[project.urls]
Repository = "https://github.com/ZHOUZHEN2002/ManifoldVelo"
Issues = "https://github.com/ZHOUZHEN2002/ManifoldVelo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
